[project]
name = "jev-route-my-subagents"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["requests==2.34.2", "pyyaml==6.0.3"]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pyrefly==1.3.2",
    "pytest==9.1.1",
    "types-requests==2.33.0.20261006",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ", "T10", "EM",
    "ISC", "LOG", "G", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TC", "ARG",
    "PTH", "PL", "TRY", "PERF", "FURB", "RUF",
]
ignore = ["E501", "ISC001", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001", "ARG001", "S603", "S607"]
"tests/smoke.py" = ["T20"]

[tool.pyrefly]
preset = "strict"
python-version = "3.14"
project-includes = ["scripts", "tests"]
search-path = ["scripts", "tests"]

[tool.pyrefly.errors]
deprecated = "error"
unreachable = "error"
redundant-condition = "error"
redundant-cast = "error"
unused-ignore = "error"
implicit-import = "error"
untyped-import = "error"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
